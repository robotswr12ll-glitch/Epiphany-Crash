{id:"strategist",cat:"ARCHETYPES",n:"THE STRATEGIST",ep:"Everyone else is playing checkers. They are playing the person across from them.",

lk:["parentified","codependent","optimist"],kw:["helper","people pleaser","nurse","martyr","selfless"]},

{id:"stoic",cat:"ARCHETYPES",n:"THE STOIC",ep:"You will never see them flinch. That is the whole problem.",
es:"Emotion classified as data, not experience. Calm is not a state for them — it is an identity, maintained at a cost they have never calculated.",
st:["Unshakeable in the crisis everyone else is crying through","Rational under fire; the rock in every storm","Says little and every word lands"],
wk:["Partners feel alone standing next to them","Feelings leak sideways — as tension, silence, or the body keeping score","Asks for nothing until something structural fails"],
lv:"Competence — theirs and yours",fr:"Falling apart in front of witnesses",ht:"Drama, by which they mean other people's feelings",
sp:["Answers 'how do you feel' with what they think","Comforting presence, unreachable interior","The strongest person at every funeral"],
rw:["Raise: name feelings early; give the weather a vocabulary","Love: don't force the door; sit beside it consistently","Work: the best operator you have; the worst debrief","Negotiate: they won't blink; bring data, not pressure"],
bl:"Suppressed is not processed. The bill arrives later, with interest, addressed to the body.",
or:"A house where crying changed nothing — or made it worse.",
lk:["alexithymia","avoidant","strategist"],kw:["cold","unemotional","rock","calm","distant","strong silent"]},

{id:"secure",cat:"ATTACHMENT STYLES",n:"SECURE — THE BASELINE",ep:"They can want you without needing you. It unnerves people.",
es:"The rare climate nobody writes songs about: comfortable with closeness, comfortable with space, able to say the true thing and hear the true thing back.",

wk:["Underestimates how much chaos other people carry","Can read intensity as instability and leave too early","Bored by drama that feels like love to the wounded"],
lv:"Honesty, delivered plainly",fr:"Very little — and that is the tell",ht:"Games",
sp:["Says no without a paragraph of justification","Apologizes without collapsing","Never once tests you"],
rw:["Raise: you already did — someone showed up consistently","Love: bring your whole self; they can hold it","Work: give them the ambiguous project; they will stabilize it","Negotiate: just be fair; they will notice and match it"],
bl:"They sometimes cannot read the weather in people who never had their climate.",
or:"Someone showed up, consistently, when they were small. That is the entire recipe.",
lk:["anxious","avoidant","disorganized"],kw:["stable","healthy","grounded","secure attachment"]},

{id:"anxious",cat:"ATTACHMENT STYLES",n:"ANXIOUS — THE TIDE",ep:"They don't miss you. They monitor you.",
es:"Love registered early as a signal that can drop without warning. Every silence is a cliff edge; every relationship is a radio station they keep fine-tuning, terrified of static.",
st:["Devotion at full volume, indefinitely","Radar for shifts in tone that border on the psychic","Fights for the relationship — sometimes past its funeral"],
wk:["Protest behavior: the tests, the double texts, the manufactured exits","Abandons themselves to avoid being abandoned","Reassurance has a half-life of about four hours"],
lv:"Reassurance — explicit, repeated, preferably in writing",fr:"The fade: love quietly downgrading without an announcement",ht:"'I need space' — four words, one siren",
sp:["Remembers exactly when you last said it","Reads typing dots like tea leaves","Apologizes before you knew anything happened"],
rw:["Raise: be boringly predictable; routine is the medicine","Love: reassure before they ask — asking costs them dignity","Work: clear feedback, regularly; silence breeds screenplays","Negotiate: never use withdrawal as leverage; it detonates them"],
bl:"The tests designed to prevent abandonment often perform it.",
or:"Inconsistent care — love on a variable schedule — taught the nervous system to never clock out.",
lk:["codependent","rsd","avoidant","limerence","bpd"],kw:["clingy","jealous","needy","double text","anxious attachment","left on read"]},

{id:"avoidant",cat:"ATTACHMENT STYLES",n:"AVOIDANT — THE EXIT ARTIST",ep:"They leave before anyone can leave them. Then they call it independence.",
es:"Closeness equals pressure. The nearer you get, the more the exits light up. They are not cold — they are a country with strict immigration policy and excellent emigration services.",
st:["Self-reliance that survives shipwrecks","Cool in crisis; feelings never hijack the controls","Never clingy, never suffocating, never a burden"],
wk:["Intimacy starves in their care; partners feel managed, not met","Deactivates: finds flaws in anyone who gets close","Misses people most when they are gone — the distance is the point"],
lv:"Autonomy — the door they can open themselves",fr:"Engulfment: being swallowed by someone else's needs",ht:"'We need to talk'",
sp:["Keeps it light at month three; vague about year two","Withdraws right after the best weekend","Their independence is mentioned more often than their feelings"],
rw:["Raise: respect the no; connection forced is connection lost","Love: pursue gently and steadily; pressure is the eject button","Work: autonomy plus accountability; micromanagement is fatal","Negotiate: give them an exit and they may stay for the conversation"],
bl:"They call the loneliness freedom because they chose the door themselves.",
or:"A caregiver who couldn't be leaned on — needs met with irritation, so the needs were deleted.",
lk:["stoic","anxious","strategist","neglect","alexithymia"],kw:["leave first","commitment issues","distant","runs away","emotionally unavailable","avoidant attachment"]},

{id:"disorganized",cat:"ATTACHMENT STYLES",n:"DISORGANIZED — THE STORM",ep:"Come here. Go away. Both are true, at full volume, in the same breath.",
es:"The source of comfort was also the source of fear, so love itself trips the alarm. They reach for people with one hand and check for weapons with the other.",
st:["Depth — their intimacy, when it lands, is unforgettable","Radical honesty in flashes that cuts years of pretense","Passion that makes everyone else's look rehearsed"],
wk:["Push-pull chaos; sabotages the thing it begs for","Tests partners with exams they never announced","Calm relationships feel wrong; peace reads as the quiet before it"],
lv:"Intensity — it is the only proof that feels real",fr:"Closeness and distance, simultaneously, forever",ht:"Feeling predictable; being 'figured out'",
sp:["The best first month of your life, then static","Affection that arrives in weather systems","You failed a test you never knew you sat"],
rw:["Raise: safety plus structure, for years, without retaliation","Love: consistency is the only argument that has ever worked","Work: clear expectations; ambiguity becomes catastrophe","Negotiate: never corner them; offer the face-saving exit"],
bl:"The chaos is not passion. It is a fire alarm wired to a doorbell.",
or:"Frightening or frightened caregiving — love and danger arriving in the same arms.",
lk:["bpd","anxious","avoidant","cptsd"],kw:["hot and cold","push pull","toxic","rollercoaster","fearful avoidant"]},

{id:"father",cat:"WOUNDS",n:"THE FATHER WOUND",ep:"They stopped expecting to be chosen. Everything since has been an audition or a revenge.",
es:"The first man set the exchange rate of their worth — absent, critical, or conditional — and every boss, lover and rival since has been asked to settle the account.",
st:["Drive that outworks entire rooms","Self-sufficiency learned before it was safe","Gravitas; they command respect because they had to earn it wholesale"],
wk:["Chases approval from authority figures who did not ask for the job","Dating becomes re-enactment or avoidance; rarely just dating","Cannot hear praise from the people it actually matters from"],
lv:"Respect that is earned and witnessed",fr:"Being ordinary in his eyes — even now, even if he's gone",ht:"Needing anyone's blessing; needing it anyway",
sp:["Over-explains achievements to unimpressed rooms","Either idolizes male authority or refuses it entirely","Every success story ends with a shrug that costs them"],
rw:["Raise: show up, stay, say 'I see you' without a reason","Love: they will test whether you leave; the test is the relationship","Work: give credit in writing; they collect it like rations","Negotiate: respect their competence and the deal is half done"],
bl:"The audition never ends because the judge left the building years ago. The performance continues anyway.",
or:"A father who was a critic, a ghost, or a competitor — and a child who kept score.",
lk:["perfectionist","narcissist","rsd","conditional"],kw:["daddy issues","absent father","dad","approval","never good enough for dad"]},

{id:"mother",cat:"WOUNDS",n:"THE MOTHER WOUND",ep:"The first mirror was cracked. They have been checking their reflection ever since.",
es:"The first relationship taught them that love has weather. Whether she was enmeshed, critical, fragile or role-reversed, her moods became their climate — and the climate moved in permanently.",
st:["Attunement to moods that borders on weather forecasting","Emotional literacy; they can name what others only feel","Endurance of the quietly heroic kind"],
wk:["Guilt is the default setting; boundaries feel like betrayal","Her disappointment still moderates their inner parliament, at any age","Cannot criticize her without defending her in the same breath"],
lv:"Peace — the house calm, the phone silent",fr:"Her sigh. At forty. From another city.",ht:"Calls that end with 'fine' in a tone that isn't",
sp:["Apologizes to furniture","Manages everyone's feelings before their own","Says 'she did her best' with a face that knows better"],
rw:["Raise: let the child be the child; carry your own weather","Love: they will mother you; redirect it gently or disappear","Work: they over-function; assign boundaries like tasks","Negotiate: guilt works on them, which is exactly why you shouldn't"],
bl:"Leaving the role feels like leaving her — loyalty to the wound masquerading as love.",
or:"A mother who loved through control, fragility, or need — and a child who became the regulator.",
lk:["codependent","parentified","anxious","golden"],kw:["mommy issues","enmeshed","controlling mother","guilt","mama's boy"]},

{id:"parentified",cat:"WOUNDS",n:"THE PARENTIFIED CHILD",ep:"They raised their parents. Nobody raised them.",
es:"The kid who became the adult — therapist, mediator, translator, third parent — before they had the tools, the vocabulary, or a choice in the matter.",
st:["Competence that frightens people twice their age","Crisis-proof; they have been managing emergencies since childhood","Reads rooms instantly, because rooms used to be dangerous"],
wk:["Does not know what they want; wanting was never the job","Play feels foreign; rest feels like neglect","Gives world-class advice and takes none of it"],
lv:"Being capable — it is the only identity that ever fit",fr:"Being a burden; needing anything audibly",ht:"'What do you need?' — a question with no script",
sp:["The reliable one in every group, every family, every crisis","Childhood stories where adults call them 'so mature'","Exhausted in a way sleep doesn't touch"],
rw:["Raise: they raised themselves; witness it without worshipping it","Love: take care of them without asking permission; they will never grant it","Work: delegate to them, then check if they've eaten","Negotiate: they undervalue themselves; pay fairly and watch them be confused"],
bl:"Maturity was the costume. The child is still waiting backstage for a childhood that isn't coming.",
or:"Adult problems handed to small hands — addiction, illness, divorce, poverty, or a parent who simply refused the job.",
lk:["caregiver","codependent","stoic","mother"],kw:["eldest daughter","grew up fast","mature for their age","little adult","parentified"]},

{id:"golden",cat:"WOUNDS",n:"GOLDEN CHILD / SCAPEGOAT",ep:"One can do no wrong. One can do no right. Same house, same parents.",
es:"Families assign roles. The golden child is loved as a trophy — for the shine, not the self. The scapegoat is blamed as a pressure valve — for the truth, not the crime. Both are cages; only the lighting differs.",
st:["Golden: polish, achievement, an instinct for what impresses","Scapegoat: truth-telling, resilience, an exit already built","Both: a forensic understanding of favoritism"],
wk:["Golden: collapses when the applause stops; the self was never assembled","Scapegoat: internalized blame; expects the accusation before the hello","Both: siblings they grieve and cannot reach"],
lv:"Golden: winning. Scapegoat: being believed.",fr:"Golden: ordinariness. Scapegoat: that it's true.",ht:"Family dinners",
sp:["Golden: a resume where the personality should be","Scapegoat: flinches at praise, over-explains innocence","Both: the family story doesn't match their memory of it"],
rw:["Raise: love the child, not the reflection; blame actions, not identity","Love: golden needs unconditional boring love; scapegoat needs to be believed","Work: golden over-delivers for approval; scapegoat needs explicit credit","Negotiate: golden folds if approval is threatened; scapegoat if fairness is"],
bl:"The roles were never about either of them. They were cast in someone else's play.",
or:"A parent who needed a hero and a culprit more than they needed children.",
lk:["narcissist","perfectionist","conditional","father"],kw:["golden child","scapegoat","favorite","black sheep","family roles"]},

{id:"neglect",cat:"WOUNDS",n:"EMOTIONAL NEGLECT",ep:"Nothing bad happened. That is the wound.",
es:"No trauma to point at, no story to tell — just an absence. Feelings were ignored so thoroughly that they learned to ignore them too. The house was fine. Nobody lived in it emotionally.",
st:["Low-maintenance to a fault; needs nothing, asks less","Independent; self-soothing since toddlerhood","Undramatic — a calm port in any storm"],
wk:["Cannot name needs they were never taught to have","Feels invisible in crowds of people who like them","Numb where others are warm; lonely without a reason they can cite"],
lv:"Quiet — undemanding, uneventful quiet",fr:"Being too much; the house taught them they already were",ht:"'Tell me about your childhood' — there's nothing to tell. That's the point.",
sp:["Describes the childhood as 'fine, normal' and changes the subject","Apologizes for taking up space, time, oxygen","Deeply lonely and genuinely cannot say why"],
rw:["Raise: ask how it feels in there, then survive the answer","Love: they will never ask — offer, gently, repeatedly","Work: they underreport everything; check in on schedule, not vibe","Negotiate: they accept the first offer; be decent"],
bl:"The absence shaped them as surely as any presence shapes anyone. They just can't point at it.",
or:"Parents who fed, clothed, and never once asked how it felt in there.",
lk:["alexithymia","avoidant","stoic"],kw:["neglect","lonely","invisible","numb","fine childhood","empty"]},

{id:"conditional",cat:"WOUNDS",n:"CONDITIONAL LOVE",ep:"Affection had terms and conditions. They still read every room for the fine print.",
es:"Love arrived with achievement and left with failure. Worth became a quarterly report, and they have been reporting ever since — to bosses, partners, mirrors.",

wk:["Cannot rest; rest reads as fraud","Love feels transactional; kindness must be invoiced and repaid","Vulnerability feels like a contract risk"],
lv:"Scoreboard wins — unarguable, dated, documented",fr:"Being loved 'for nothing' — they would not believe it or trust it",ht:"Unconditional people; suspicious characters",
sp:["Reports accomplishments when you ask how they are","Cannot accept a gift without reciprocating by Friday","Fishes with results, never with feelings"],
rw:["Raise: hug them on the day they fail, specifically","Love: love them badly, boringly, without cause — it rewires everything","Work: they need metrics and will over-serve them","Negotiate: their worth is on the table; don't put it there"],
bl:"They are still performing for a verdict that was never about the performance.",
or:"Praise for grades, silence for feelings. A hug with a rubric.",
lk:["perfectionist","golden","father"],kw:["tiger parent","grades","trophy","approval","never enough","conditional"]},

{id:"narcissist",cat:"CLINICAL PATTERNS",clin:1,n:"THE NARCISSISTIC PATTERN",ep:"The mirror has to be fed.",
es:"Beneath the shine is a self that never got securely built. Admiration is load-bearing; criticism registers as structural damage. A pattern of tendencies — grandiosity, hunger for supply, empathy that dims under threat — not a verdict.",
st:["Charisma that reorganizes rooms","Vision and the nerve to chase it","Composure where others panic"],
wk:["Criticism reads as attack; feedback becomes warfare","Empathy is situational — full for the useful, dim for the rest","Relationships quietly become supply chains"],
lv:"Being exceptional, witnessed",fr:"Ordinariness; being truly seen",ht:"Indifference — an insult is preferable",
sp:["Every conversation orbits back to them","Rages at slights nobody else registered","Charm with a timer on it"],
rw:["Raise: value the child, not the shine; criticize the act, never the being","Love: you will be an audience; decide if that's a life","Work: give them the stage and guard the team","Negotiate: frame your win as their glory"],
bl:"The grandiosity is the bandage, not the wound — and the wound is ordinary, aching shame.",
or:"Often conditional love plus golden-child inflation: valued for the shine, never for the self.",
lk:["golden","manipulator","rsd","father"],kw:["narcissist","npd","ego","vain","self obsessed","main character"]},

{id:"bpd",cat:"CLINICAL PATTERNS",clin:1,n:"THE BORDERLINE PATTERN",ep:"I hate you. Don't leave me. Both at full volume.",
es:"Emotions without a dimmer switch, and attachment wired to a fire alarm. The pattern: intensity, terror of abandonment, and a self-image that shifts with the last person who reflected it. Tendencies on a spectrum — not a verdict.",
st:["Empathy at high fidelity; they feel your feelings before you do","Passion and loyalty of the total kind","Aliveness that ordinary life rarely offers"],
wk:["Splitting — hero to villain in an hour, and back by morning","Abandonment feared so hard it gets performed","The storm feels caused by whoever is standing nearest"],
lv:"Total closeness; all of you, all the time",fr:"The moment you leave — rehearsed daily, for years",ht:"Neutrality; lukewarm anything",
sp:["Relationships begin at movie speed","A delayed reply is processed as a verdict","Apologizes like it's the last conversation you will ever have"],
rw:["Raise: validate the feeling, hold the boundary, both always","Love: boring consistency; it is the only known antidote","Work: clear expectations and zero ambiguity in tone","Negotiate: never during the storm; schedule the talk for the calm"],
bl:"The storm feels caused by others. It starts earlier and deeper — the others are just weather.",
or:"Invalidation plus chaos: feelings punished or mocked, then wondered at when they grew teeth.",
lk:["disorganized","rsd","cptsd","anxious"],kw:["bpd","borderline","splitting","intense","abandonment","favorite person"]},

{id:"adhd",cat:"CLINICAL PATTERNS",clin:1,n:"THE ADHD PATTERN",ep:"Behind schedule in a race nobody else is running.",
es:"An interest-driven nervous system. Attention is not absent — it is on a different payroll, and it only works for novelty, urgency, passion or panic. Not laziness. Not a character flaw. Wiring.",
st:["Hyperfocus that moves actual mountains","Creativity under deadline fire","Notices the connection everyone else missed — while missing the meeting"],
wk:["Time blindness; the hour is a rumor","The laundry chair, the 47 tabs, the unopened mail","Shame from a thousand small failures that were never about effort"],
lv:"Novelty and urgency — the only two fuels on the pump",fr:"Boredom the way other people fear pain",ht:"'Just focus' — two words that solve nothing, forever",
sp:["Brilliant, elaborate excuses that are somehow all true","Late despite leaving early","Their desk is an archaeology of abandoned hobbies"],
rw:["Raise: structure the environment, not the child; interest is the ignition","Love: body-double their boring tasks; never mother their calendar","Work: novelty, urgency, and forgiveness in writing","Negotiate: short meetings. Shorter. There it is."],
bl:"The deficit was never effort. The shame about it has done more damage than the trait ever will.",
or:"Wiring, not raising — though years of 'lazy' and 'potential' become a second wound on top of the first.",
lk:["rsd","perfectionist","nihilist"],kw:["adhd","can't sit still","focus","late","procrastinate","distracted","hyperfocus"]},

{id:"autism",cat:"CLINICAL PATTERNS",clin:1,n:"MASKED AUTISM",ep:"They perform normal so well that the standing ovation exhausts them.",
es:"Social rules learned as a second language — fluency achieved at cost. The mask is craftsmanship: studied expressions, rehearsed scripts, calibrated eye contact. The audience sees ease. The performer pays the invoice at midnight.",
st:["Pattern-sense that reads systems others only inhabit","Loyalty and honesty others cannot afford","Depth in chosen interests that borders on mastery"],
wk:["The crash after performing; evenings spent recovering from lunch","Sensory overwhelm disguised as rudeness or flakiness","Burnout cycles the calendar never sees coming"],
lv:"The special interest — and people who don't require the mask",fr:"Being 'too much' and 'not enough' in the same interaction",ht:"Unwritten rules everyone pretends are natural",
sp:["Rehearses phone calls; avoids the unscripted ones","Eye contact that looks measured, because it is","The laugh arrives a beat late and exactly right"],
rw:["Raise: unmask at home; home is where the stim is safe","Love: directness is kindness; hints are cruelty","Work: written instructions and warning before surprises","Negotiate: say exactly what you mean; they will, too"],
bl:"They think everyone is performing this hard. Most people are not.",
or:"Wiring meeting a world that grades on a neurotypical curve; the mask built in childhood, brick by careful brick.",
lk:["alexithymia","stoic","rsd","avoidant"],kw:["autism","masking","asperger","sensory","stimming","perform normal","scripted"]},

{id:"ocd",cat:"CLINICAL PATTERNS",clin:1,n:"THE OCD PATTERN",ep:"The alarm is false. The fear is not.",
es:"Intrusive thoughts met with rituals; certainty chased and never caught. Not tidiness — terror with a checklist. The thoughts feel like confessions; the rituals feel like bail. Both are symptoms.",
st:["Conscientiousness that catches what everyone else ships","Reliability; if they said it, it happened","Attention to true detail under pressure"],
wk:["Rituals eat hours and feed nothing","Reassurance never holds; the doubt regenerates","Responsibility inflated to cosmic scale: if I can prevent it, I must"],
lv:"Certainty — the one product never in stock",fr:"Their own mind at 3 AM",ht:"'I'm so OCD,' said by tidy people",
sp:["Checks what is already checked, then doubts the checking","Confesses thoughts to defuse them; relief lasts minutes","Arranges, counts, or replays — privately, ashamedly"],
rw:["Raise: never use their rituals against them; accommodate less, support more","Love: the thoughts are symptoms, not secrets; hear them without flinching","Work: precision roles, hard deadlines, zero ambiguity about done","Negotiate: written terms calm them; verbal drift costs them sleep"],
bl:"The ritual is the problem wearing the costume of the solution.",
or:"Wiring plus an inflated sense of responsibility — often a child who believed their thoughts could cause the world.",
lk:["perfectionist","cptsd","traditionalist"],kw:["ocd","intrusive thoughts","checking","rituals","contamination","certainty"]},

{id:"cptsd",cat:"CLINICAL PATTERNS",clin:1,n:"HYPERVIGILANCE — THE C-PTSD PATTERN",ep:"They read the room before they enter it. They never fully enter it.",
es:"A threat-detection system trained young and never decommissioned. The body is calm; the mind is sweeping. It is not anxiety about the future — it is memory, running as background process, forever.",
st:["Nothing gets past them; micro-shifts in tone register instantly","Crisis-tested; when it actually happens, they are already done","Loyalty to the safe few that outlasts everything"],
wk:["Exhaustion — the system runs at night, too","Startles at tone shifts, footsteps, keys in doors","Safety never fully registers; the all-clear never arrives"],
lv:"Predictability, and a seat facing the door",fr:"Being trapped; being surprised",ht:"'Just relax,' offered as advice",
sp:["Sits facing the exit; catalogs the room without appearing to","Tracks footsteps and knows the household by its sounds","The smile stays while the eyes sweep"],
rw:["Raise: predictable everything — moods, meals, consequences","Love: announce yourself; never grab from behind; keep every small promise","Work: clear authority, no surprise reviews, honest timelines","Negotiate: no pressure tactics; pressure reads as threat and the deal is dead"],
bl:"The danger retired years ago. The soldier didn't.",
or:"An environment where reading the weather fast was survival — violence, volatility, addiction, or all three.",
lk:["disorganized","codependent","avoidant","bpd"],kw:["ptsd","cptsd","trauma","hypervigilant","startle","on edge","flashback"]},

{id:"codependent",cat:"CLINICAL PATTERNS",clin:1,n:"CODEPENDENCY — THE FAWN RESPONSE",ep:"Their personality is a peace treaty.",

{id:"rsd",cat:"CLINICAL PATTERNS",clin:1,n:"REJECTION SENSITIVE DYSPHORIA",ep:"A short reply. A paused conversation. A whole funeral, held in seconds.",

rw:["Raise: name feelings out loud, theirs and yours, like colors","Love: learn their actual language; the fixed sink is a love letter","Work: roles with clear outputs; feelings-meetings are their tax audit","Negotiate: they mean exactly what they said; there is no subtext to find"],

{id:"limerence",cat:"CLINICAL PATTERNS",clin:1,n:"LIMERENCE",ep:"It is not love. It is an obsession wearing love's clothes.",

st:["Capacity for devotion most people never approach","Romantic imagination of cinematic scale","Focus — when the target is a person, nothing else exists"],
wk:["Lives for signals; productivity hostage to one person's attention","Mistakes anxiety for destiny — the chest-tightening must mean something","Neglects the actual, available people for the almost"],

/* ============================================================
   NAVIGATION — simple screen switcher with an iOS-style back
   ============================================================ */
const TITLES={"scr-home":"MIRROR","scr-codex":"THE CODEX","scr-entry":"ENTRY",
"scr-quiz":"THE READING","scr-verdict":"THE VERDICT"};
let historyStack=["scr-home"];
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  document.getElementById("navTitle").textContent=TITLES[id];
  const back=document.getElementById("navBack");
  if(historyStack[historyStack.length-1]!==id) historyStack.push(id);
  back.style.display = historyStack.length>1 ? "block":"none";
  window.scrollTo(0,0);
}
function goBack(){
  historyStack.pop();
  const prev=historyStack.pop()||"scr-home";
  show(prev);
}

    if(!items.length) return;
    hits+=items.length;
    html+='<div class="group-title">'+cat+"</div><div class='group'>";
    items.forEach(e=>{
      html+='<div class="cell" onclick="openEntry(\''+e.id+'\')">'
        +'<div class="nm">'+e.n+"</div>"
        +'<div class="ep">'+e.ep+"</div></div>";
    });
    html+="</div>";
  });
  list.innerHTML=html;
  document.getElementById("noRes").style.display = hits? "none":"block";
}
function matchEntry(e,q){
  if(!q) return true;
  const hay=(e.n+" "+e.ep+" "+e.es+" "+e.kw.join(" ")).toLowerCase();
  return q.split(/\s+/).every(w=>hay.indexOf(w)!==-1);
}
function openEntry(id){
  const e=ENTRIES.find(x=>x.id===id); if(!e) return;
  const rwLabels=["RAISE","LOVE","WORK WITH","NEGOTIATE WITH"];
  let h='<div class="entry-head"><div class="entry-cat">'+e.cat+'</div>'
    +'<div class="entry-name">'+e.n+'</div>'
    +'<div class="entry-ep">\u201C'+e.ep+'\u201D</div><div class="hairline"></div></div>';
  h+='<div class="section"><h3>THE ESSENCE</h3><p>'+e.es+"</p></div>";
  h+='<div class="section"><h3>STRENGTHS</h3><ul>'+e.st.map(s=>"<li>"+s+"</li>").join("")+"</ul></div>";
  h+='<div class="section"><h3>WEAKNESSES</h3><ul>'+e.wk.map(s=>"<li>"+s+"</li>").join("")+"</ul></div>";
  h+='<div class="section"><h3>LOVES · FEARS · HATES</h3><div class="tri">'
    +"<div><b>LOVES</b>"+e.lv+"</div><div><b>FEARS</b>"+e.fr+"</div><div><b>HATES</b>"+e.ht+"</div>"
    +"</div></div>";
  h+='<div class="section"><h3>HOW TO SPOT ONE</h3><ul>'+e.sp.map(s=>"<li>"+s+"</li>").join("")+"</ul></div>";
  h+='<div class="section"><h3>HOW TO HANDLE ONE</h3><ul>'
    +e.rw.map((s,i)=>"<li><b>"+rwLabels[i]+"</b> — "+s.split(": ")[1]+"</li>").join("")+"</ul></div>";
  h+='<div class="section"><h3>THE BLIND SPOT</h3><p>'+e.bl+"</p></div>";
  h+='<div class="section"><h3>ORIGIN</h3><p>'+e.or+"</p></div>";
  h+='<div class="section"><h3>CROSS-LINKS</h3><div>'
    +e.lk.map(l=>{const t=ENTRIES.find(x=>x.id===l);
      return t?'<span class="link-chip" onclick="openEntry(\''+l+'\')">'+t.n+"</span>":"";}).join("")
    +"</div></div>";
  if(e.clin) h+='<div class="prof-note">A professional sees what a codex cannot.</div>';
  document.getElementById("entryBody").innerHTML=h;
  show("scr-entry");
}

/* ============================================================
   THE QUIZ — engine, pattern log, off-script interrupter
   ============================================================ */
let S=null; // quiz state
function startQuiz(){
  S={qi:0,log:[],a:{},t:{},w:{},c:{},x:{},fired:[],pending:null};
  show("scr-quiz");
  renderQ();
}
function renderQ(){
  const strike=S.pending;
  const total=QUESTIONS.length;
  const done=S.log.length;
  document.getElementById("pfill").style.width=Math.min(100,done/total*100)+"%";
  const card=document.getElementById("qcard");
  const qtext=document.getElementById("qtext");
  const opts=document.getElementById("opts");
  let qobj;
  if(strike){
    document.getElementById("qcount").textContent="OFF SCRIPT — SIGNATURE DETECTED";
    card.classList.add("strike");
    qtext.innerHTML='<span class="strike-tag">MIRROR INTERRUPTS</span>'+strike.q;
    qobj=strike;
  }else{
    document.getElementById("qcount").textContent="SCENARIO "+(S.qi+1)+" OF "+total;
    card.classList.remove("strike");
    qtext.textContent=QUESTIONS[S.qi].q;
    qobj=QUESTIONS[S.qi];
  }
  opts.innerHTML="";
  qobj.o.forEach((op,i)=>{
    const d=document.createElement("div");
    d.className="opt";
    d.innerHTML='<div class="cell"><div class="nm" style="font-weight:500;letter-spacing:0;line-height:1.6">'+op[0]+"</div></div>";
    d.onclick=()=>answer(qobj,op[1],i);
    opts.appendChild(d);
  });
  // re-trigger slide animation
  card.style.animation="none"; void card.offsetWidth; card.style.animation="";
}
function answer(qobj,score,optIdx){
  // 1. pattern log — every answer is recorded
  let tag;
  if(qobj.id){ tag="strike-"+qobj.id+optIdx; }
  else{ tag="q"+(S.qi+1)+String.fromCharCode(97+optIdx); S.qi++; }
  S.log.push(tag);
  // 2. apply hidden scores
  apply(S.a,score.a); apply(S.t,score.t); apply(S.w,score.w);
  apply(S.c,score.c); apply(S.x,score.x);
  // 3. off-script check: any unfired signature now complete?
  if(!S.pending){
    for(const st of STRIKES){
      if(S.fired.indexOf(st.id)===-1 && st.test(S.log)){
        S.fired.push(st.id); S.pending=st; break;
      }
    }
  }else{
    S.pending=null;
  }
  // 4. advance or finish
  if(S.pending){ renderQ(); return; }
  if(S.qi<QUESTIONS.length){ renderQ(); return; }
  runScan();
}
function apply(obj,delta){ if(!delta) return;
  for(const k in delta) obj[k]=(obj[k]||0)+delta[k]; }

/* ---------- the fake scan: MIRROR thinking ---------- */
function runScan(){
  const el=document.getElementById("scan");
  const lines=document.getElementById("scanLines");
  el.style.display="block";
  const steps=["INDEXING "+S.log.length+" RESPONSES...",
    "CROSS-REFERENCING SIGNATURE PAIRS...",
    S.fired.length+" OFF-SCRIPT SIGNATURES FIRED...",
    "WEIGHING CONTRADICTIONS (CONTRADICTIONS ARE DATA)...",
    "TRIANGULATING ATTACHMENT PATTERN...",
    "RENDERING VERDICT."];
  lines.innerHTML="";
  let i=0;
  const iv=setInterval(()=>{
    lines.innerHTML+="&gt; "+steps[i]+"<br>";
    i++;
    if(i>=steps.length){ clearInterval(iv);
      setTimeout(()=>{ el.style.display="none"; verdict(); },600); }
  },520);
}

/* ============================================================
   THE VERDICT
   ============================================================ */
function verdict(){
  // --- archetype blend: top two of ten ---
  const archs=Object.keys(S.a).sort((x,y)=>S.a[y]-S.a[x]);
  const top=archs[0], second=archs[1];
  const topEntry=ENTRIES.find(e=>e.id===top);
  const secEntry=ENTRIES.find(e=>e.id===second);
  const sum=S.a[top]+(S.a[second]||0);
  const pTop=Math.round(S.a[top]/sum*100), pSec=100-pTop;
  // --- attachment: highest tally, sec wins ties softly ---
  const attOrder=["sec","anx","avo","dis"].sort((x,y)=>(S.t[y]||0)-(S.t[x]||0));
  const att=attOrder[0];
  const attEntry=ENTRIES.find(e=>e.id===({sec:"secure",anx:"anxious",avo:"avoidant",dis:"disorganized"})[att]);
  // --- detected flags: clinical + wounds above threshold ---
  const flags=[];
  for(const k in S.c){ if(k!=="manipulator" && S.c[k]>=3) flags.push(["c",k]); }
  for(const k in S.w){ if(S.w[k]>=2) flags.push(["w",k]); }
  flags.sort((a,b)=>(S[b[0]][b[1]]||0)-(S[a[0]][a[1]]||0));
  // --- confidence: margin between top archetypes + consistency ---
  const margin=S.a[top]-(S.a[second]||0);
  const totalArch=Object.values(S.a).reduce((s,v)=>s+v,0)||1;
  const share=S.a[top]/totalArch;
  let conf="PROBABLE";
  if(margin>=4&&share>=0.3) conf="CERTAIN";
  else if(margin<=1) conf="MIXED";

  // ---------- render ----------
  let h='<div class="verdict-stamp"><div class="stamp">'+conf+'</div></div>';
  h+='<div class="blend"><div class="big">'+pTop+"% "+topEntry.n.replace("THE ","")+'</div>'
    +'<div class="pair">'+pSec+"% "+secEntry.n.replace("THE ","")+" — and they argue at night.</div>"
    +'<div class="blend-bar"><div class="a" style="width:'+pTop+'%"></div><div class="b" style="width:'+pSec+'%"></div></div></div>';
  h+='<div class="section" style="text-align:center"><p style="font-family:Georgia,serif;font-style:italic">'
    +topEntry.ep+"</p>"
    +'<p style="margin-top:10px"><span class="link-chip" onclick="openEntry(\''+topEntry.id+'\')">READ THE FULL ENTRY</span>'
    +' <span class="link-chip" onclick="openEntry(\''+secEntry.id+'\')">'+secEntry.n+"</span></p></div>";
  h+='<div class="section"><h3>THE SHAPE OF YOU — SIX AXES</h3><canvas id="radar" width="320" height="300"></canvas></div>';
  h+='<div class="section"><h3>ATTACHMENT</h3><p>'+ATTACH_LINE[att]+'</p>'
    +'<p style="margin-top:8px"><span class="link-chip" onclick="openEntry(\''+attEntry.id+'\')">READ THE FULL ENTRY</span></p></div>';
  if(flags.length){
    h+='<div class="detect"><h3 style="font-size:10px;letter-spacing:.3em;text-transform:uppercase;border-bottom:1px solid #333;padding-bottom:6px;margin-bottom:12px;">DETECTED</h3>';
    flags.slice(0,6).forEach(f=>{
      h+="<p><b>Detected:</b> "+DETECT[f[1]]+"</p>";
    });
    h+="</div>";
    h+='<div class="section"><h3>RELATED ENTRIES</h3><div>'
      +flags.slice(0,6).map(f=>{const e=ENTRIES.find(x=>x.id===f[1]);
        return e?'<span class="link-chip" onclick="openEntry(\''+e.id+'\')">'+e.n+"</span>":"";}).join("")
      +"</div></div>";
  }
  h+='<div class="disclaimer">This is an educated read, not a diagnosis. If it rings true, that is data — take it to a professional, not to a label.</div>';
  h+='<div class="stat-row">'+S.log.length+" ANSWERS LOGGED · "+S.fired.length+" SIGNATURES FIRED · CONFIDENCE "+conf+"</div>";
  h+='<button class="gloss-btn" onclick="startQuiz()">Read Me Again</button>'
    +'<button class="gloss-btn ghost" onclick="show(\'scr-codex\')">Enter the Codex</button>';
  document.getElementById("verdictBody").innerHTML=h;
  show("scr-verdict");
  drawRadar();
}

/* ---------- radar chart — plain canvas, 6 axes ---------- */
function drawRadar(){
  const cv=document.getElementById("radar"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const cx=160,cy=155,R=100,n=AXES.length;
  // normalize each axis to 0..1 (range roughly -6..+6)
  const vals=AXES.map(a=>{const v=S.x[a[0]]||0; return Math.max(0,Math.min(1,(v+6)/12));});
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.font="9px Helvetica"; ctx.textAlign="center";
  // grid rings
  for(let r=1;r<=4;r++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const ang=-Math.PI/2+i*(Math.PI*2/n);
      const rad=R*r/4;
      const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.strokeStyle="#d6d4cf"; ctx.stroke();
  }
  // spokes + labels
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2+i*(Math.PI*2/n);
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);
    ctx.strokeStyle="#e0ded9"; ctx.stroke();
    ctx.fillStyle="#777";
    ctx.fillText(AXES[i][1],cx+Math.cos(ang)*(R+24),cy+Math.sin(ang)*(R+22)+3);
  }
  // the shape of you
  ctx.beginPath();
  for(let i=0;i<=n;i++){ const idx=i%n;
    const ang=-Math.PI/2+idx*(Math.PI*2/n);
    const rad=R*(0.08+0.92*vals[idx]);
    const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fill();
  ctx.strokeStyle="#111"; ctx.lineWidth=2; ctx.stroke();
}

/* ---------- boot ---------- */
renderCodex();
</script>
